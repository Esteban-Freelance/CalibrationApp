name: Build and Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build (cross-platform only)
      run: dotnet build CalibriCore CalibriDevices NetworkScanner CalibriConsole CalibriTests --no-restore
    
    - name: Test
      run: dotnet test CalibriTests --no-build --verbosity normal
